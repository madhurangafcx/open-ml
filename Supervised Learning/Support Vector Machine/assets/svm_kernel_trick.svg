<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#161f30"/>
    </linearGradient>
    <linearGradient id="planeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="blueBall2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="redBall2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="mapArrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <polygon points="0 1, 9 5, 0 9" fill="#c084fc"/>
    </marker>
    <marker id="axisArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="480" rx="16" fill="url(#bgGrad2)"/>
  <rect x="1" y="1" width="898" height="478" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title -->
  <rect x="250" y="15" width="400" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="450" y="37" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    THE KERNEL TRICK: NON-LINEAR FEATURE MAPPING
  </text>

  <!-- ==================== LEFT PANEL: 2D INPUT SPACE ==================== -->
  <rect x="40" y="65" width="360" height="380" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="220" y="95" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    1. Input Space (2D: x₁, x₂)
  </text>
  <text x="220" y="115" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Non-Linearly Separable (Concentric)
  </text>

  <!-- 2D Axes -->
  <line x1="80" y1="270" x2="360" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#axisArrow)"/>
  <line x1="220" y1="410" x2="220" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#axisArrow)"/>
  <text x="355" y="295" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12">x₁</text>
  <text x="205" y="140" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12">x₂</text>

  <!-- Non-linear circular decision boundary (dashed green) -->
  <circle cx="220" cy="270" r="75" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="220" y="365" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    Requires Non-Linear Boundary: x₁² + x₂² = r²
  </text>

  <!-- Inner Cluster: Blue Circles (Class +1) -->
  <circle cx="220" cy="270" r="8" fill="url(#blueBall2)"/>
  <circle cx="205" cy="255" r="8" fill="url(#blueBall2)"/>
  <circle cx="235" cy="255" r="8" fill="url(#blueBall2)"/>
  <circle cx="205" cy="285" r="8" fill="url(#blueBall2)"/>
  <circle cx="235" cy="285" r="8" fill="url(#blueBall2)"/>
  <circle cx="220" cy="245" r="8" fill="url(#blueBall2)"/>
  <circle cx="220" cy="295" r="8" fill="url(#blueBall2)"/>
  <circle cx="195" cy="270" r="8" fill="url(#blueBall2)"/>
  <circle cx="245" cy="270" r="8" fill="url(#blueBall2)"/>

  <!-- Outer Ring: Red Squares (Class -1) -->
  <rect x="212" y="165" width="15" height="15" rx="3" fill="url(#redBall2)"/>
  <rect x="270" y="180" width="15" height="15" rx="3" fill="url(#redBall2)"/>
  <rect x="310" y="225" width="15" height="15" rx="3" fill="url(#redBall2)"/>
  <rect x="315" y="275" width="15" height="15" rx="3" fill="url(#redBall2)"/>
  <rect x="290" y="325" width="15" height="15" rx="3" fill="url(#redBall2)"/>
  <rect x="240" y="355" width="15" height="15" rx="3" fill="url(#redBall2)"/>
  <rect x="180" y="355" width="15" height="15" rx="3" fill="url(#redBall2)"/>
  <rect x="135" y="325" width="15" height="15" rx="3" fill="url(#redBall2)"/>
  <rect x="110" y="275" width="15" height="15" rx="3" fill="url(#redBall2)"/>
  <rect x="115" y="225" width="15" height="15" rx="3" fill="url(#redBall2)"/>
  <rect x="155" y="180" width="15" height="15" rx="3" fill="url(#redBall2)"/>

  <!-- Straight Line Impossible Notice -->
  <line x1="90" y1="390" x2="350" y2="150" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
  <text x="130" y="420" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
    ✗ No straight line can separate them!
  </text>

  <!-- ==================== MIDDLE: MAPPING TRANSFORMATION ==================== -->
  <g transform="translate(405, 220)">
    <!-- Curved Arrow -->
    <path d="M 5, 30 Q 45, -15 85, 20" fill="none" stroke="url(#arrowGrad)" stroke-width="3.5" marker-end="url(#mapArrow)"/>
    <rect x="5" y="-30" width="80" height="28" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="45" y="-12" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      Φ(x) Mapping
    </text>
    <text x="45" y="65" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">
      z = x₁² + x₂²
    </text>
  </g>

  <!-- ==================== RIGHT PANEL: 3D FEATURE SPACE ==================== -->
  <rect x="500" y="65" width="360" height="380" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="680" y="95" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    2. Feature Space (3D: x₁, x₂, z)
  </text>
  <text x="680" y="115" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Linearly Separable via Flat Hyperplane!
  </text>

  <!-- 3D Perspective Wireframe Axes -->
  <!-- Origin at (680, 320) -->
  <line x1="680" y1="320" x2="810" y2="350" stroke="#64748b" stroke-width="1.5" marker-end="url(#axisArrow)"/> <!-- x1 axis -->
  <line x1="680" y1="320" x2="550" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#axisArrow)"/> <!-- x2 axis -->
  <line x1="680" y1="320" x2="680" y2="135" stroke="#64748b" stroke-width="1.5" marker-end="url(#axisArrow)"/> <!-- z axis -->
  <text x="815" y="365" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12">x₁</text>
  <text x="540" y="375" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12">x₂</text>
  <text x="690" y="145" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">z = x₁²+x₂²</text>

  <!-- Lower Points (Blue Balls with low z = x1^2 + x2^2) -->
  <circle cx="680" cy="305" r="7" fill="url(#blueBall2)"/>
  <circle cx="665" cy="312" r="7" fill="url(#blueBall2)"/>
  <circle cx="695" cy="312" r="7" fill="url(#blueBall2)"/>
  <circle cx="670" cy="298" r="7" fill="url(#blueBall2)"/>
  <circle cx="690" cy="298" r="7" fill="url(#blueBall2)"/>
  <circle cx="680" cy="318" r="7" fill="url(#blueBall2)"/>

  <!-- Flat Separating Hyperplane in 3D (Translucent Polygon cutting horizontally) -->
  <polygon points="530,270 790,240 830,275 570,305" fill="url(#planeGrad2)" stroke="#38bdf8" stroke-width="2"/>
  <text x="800" y="235" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">
    Separating Plane (z = c)
  </text>

  <!-- Higher Points (Red Squares with high z = x1^2 + x2^2) -->
  <rect x="672" y="170" width="14" height="14" rx="3" fill="url(#redBall2)"/>
  <rect x="715" y="180" width="14" height="14" rx="3" fill="url(#redBall2)"/>
  <rect x="745" y="200" width="14" height="14" rx="3" fill="url(#redBall2)"/>
  <rect x="750" y="225" width="14" height="14" rx="3" fill="url(#redBall2)"/>
  <rect x="720" y="240" width="14" height="14" rx="3" fill="url(#redBall2)"/>
  <rect x="640" y="240" width="14" height="14" rx="3" fill="url(#redBall2)"/>
  <rect x="610" y="225" width="14" height="14" rx="3" fill="url(#redBall2)"/>
  <rect x="615" y="200" width="14" height="14" rx="3" fill="url(#redBall2)"/>
  <rect x="645" y="180" width="14" height="14" rx="3" fill="url(#redBall2)"/>

  <!-- Success Indicator -->
  <rect x="540" y="400" width="280" height="30" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="680" y="420" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    ✓ Clean Linear Separation in 3D Space!
  </text>

  <!-- Bottom Core Insight Banner -->
  <rect x="120" y="448" width="660" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="464" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    Key Insight: The Kernel Function K(x, z) = ⟨Φ(x), Φ(z)⟩ calculates 3D dot products directly without visiting 3D space!
  </text>
</svg>
