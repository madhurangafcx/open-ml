<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="marginBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="blueBall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="redBall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowYellow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <!-- Markers for Vectors & Dimensions -->
    <marker id="arrowHead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0 0, 9 4.5, 0 9" fill="#38bdf8"/>
    </marker>
    <marker id="dimArrowStart" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <polygon points="8 0, 0 4, 8 8" fill="#fbbf24"/>
    </marker>
    <marker id="dimArrowEnd" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="850" height="520" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="848" height="518" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle Coordinate Grid -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="3,6" opacity="0.4">
    <line x1="80" y1="80" x2="80" y2="440"/>
    <line x1="160" y1="80" x2="160" y2="440"/>
    <line x1="240" y1="80" x2="240" y2="440"/>
    <line x1="320" y1="80" x2="320" y2="440"/>
    <line x1="400" y1="80" x2="400" y2="440"/>
    <line x1="480" y1="80" x2="480" y2="440"/>
    <line x1="560" y1="80" x2="560" y2="440"/>
    <line x1="640" y1="80" x2="640" y2="440"/>
    <line x1="720" y1="80" x2="720" y2="440"/>

    <line x1="80" y1="120" x2="780" y2="120"/>
    <line x1="80" y1="180" x2="780" y2="180"/>
    <line x1="80" y1="240" x2="780" y2="240"/>
    <line x1="80" y1="300" x2="780" y2="300"/>
    <line x1="80" y1="360" x2="780" y2="360"/>
    <line x1="80" y1="420" x2="780" y2="420"/>
  </g>

  <!-- Feature Axes -->
  <line x1="80" y1="450" x2="800" y2="450" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowHead)"/>
  <line x1="80" y1="450" x2="80" y2="40" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowHead)"/>
  <text x="795" y="480" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Feature x₁</text>
  <text x="35" y="45" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Feature x₂</text>

  <!-- Title Badge -->
  <rect x="230" y="16" width="390" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="425" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    SUPPORT VECTOR MACHINE: MAXIMUM MARGIN HYPERPLANE
  </text>

  <!-- Shaded Margin Region (Street/Corridor) -->
  <!-- Margin band boundaries: line 1 from (110, 430) to (530, 50) and line 2 from (250, 450) to (670, 70) -->
  <polygon points="120,440 540,60 680,70 260,450" fill="url(#marginBand)"/>

  <!-- Negative Margin Line w·x + b = -1 -->
  <line x1="120" y1="440" x2="540" y2="60" stroke="#f87171" stroke-width="2" stroke-dasharray="6,6"/>
  <!-- Positive Margin Line w·x + b = +1 -->
  <line x1="260" y1="450" x2="680" y2="70" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Optimal Separating Hyperplane w·x + b = 0 -->
  <line x1="190" y1="445" x2="610" y2="65" stroke="url(#planeGrad)" stroke-width="3.5" filter="url(#shadow)"/>

  <!-- Orthogonal Vector w (Normal to Hyperplane) -->
  <!-- Slope of hyperplane is approx (65-445)/(610-190) = -380/420 = -0.905. Normal slope is perpendicular: 420/380 = 1.105 -->
  <line x1="400" y1="255" x2="475" y2="175" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowHead)"/>
  <text x="488" y="175" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">w (Normal Vector)</text>

  <!-- Margin Width Dimension Line -->
  <!-- Line connecting negative margin to positive margin perpendicularly -->
  <line x1="330" y1="250" x2="400" y2="320" stroke="#fbbf24" stroke-width="2" marker-start="url(#dimArrowStart)" marker-end="url(#dimArrowEnd)"/>
  <rect x="365" y="270" width="130" height="28" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="430" y="289" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    Margin = 2 / ||w||
  </text>

  <!-- DATA POINTS: Class -1 (Red Squares / Negative Class) -->
  <!-- Non-support vectors (far inside red region) -->
  <rect x="140" y="230" width="18" height="18" rx="4" fill="url(#redBall)" filter="url(#shadow)"/>
  <rect x="190" y="160" width="18" height="18" rx="4" fill="url(#redBall)" filter="url(#shadow)"/>
  <rect x="230" y="110" width="18" height="18" rx="4" fill="url(#redBall)" filter="url(#shadow)"/>
  <rect x="110" y="320" width="18" height="18" rx="4" fill="url(#redBall)" filter="url(#shadow)"/>
  <rect x="160" y="360" width="18" height="18" rx="4" fill="url(#redBall)" filter="url(#shadow)"/>

  <!-- Support Vectors for Class -1 (Right on line w·x + b = -1) -->
  <!-- Point 1 at (295, 282) -->
  <circle cx="304" cy="291" r="21" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4,3" filter="url(#glowYellow)"/>
  <rect x="295" y="282" width="18" height="18" rx="4" fill="url(#redBall)"/>
  <text x="280" y="270" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Support Vector</text>

  <!-- Point 2 at (405, 182) -->
  <circle cx="414" cy="191" r="21" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4,3" filter="url(#glowYellow)"/>
  <rect x="405" y="182" width="18" height="18" rx="4" fill="url(#redBall)"/>

  <!-- DATA POINTS: Class +1 (Blue Circles / Positive Class) -->
  <!-- Non-support vectors (far inside blue region) -->
  <circle cx="560" cy="380" r="10" fill="url(#blueBall)" filter="url(#shadow)"/>
  <circle cx="620" cy="320" r="10" fill="url(#blueBall)" filter="url(#shadow)"/>
  <circle cx="690" cy="270" r="10" fill="url(#blueBall)" filter="url(#shadow)"/>
  <circle cx="710" cy="190" r="10" fill="url(#blueBall)" filter="url(#shadow)"/>
  <circle cx="600" cy="230" r="10" fill="url(#blueBall)" filter="url(#shadow)"/>
  <circle cx="510" cy="420" r="10" fill="url(#blueBall)" filter="url(#shadow)"/>

  <!-- Support Vector for Class +1 (Right on line w·x + b = +1) -->
  <!-- Point at (470, 260) -->
  <circle cx="470" cy="260" r="21" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4,3" filter="url(#glowYellow)"/>
  <circle cx="470" cy="260" r="10" fill="url(#blueBall)"/>
  <text x="495" y="265" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Support Vector</text>

  <!-- Equation Callouts -->
  <!-- Negative Margin Plane Label -->
  <rect x="90" y="90" width="160" height="32" rx="6" fill="#1e293b" stroke="#f87171" stroke-width="1.2"/>
  <text x="170" y="111" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    wᵀx + b = -1
  </text>
  <line x1="250" y1="106" x2="490" y2="106" stroke="#f87171" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Decision Boundary Label -->
  <rect x="580" y="45" width="200" height="34" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="680" y="67" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    Hyperplane: wᵀx + b = 0
  </text>

  <!-- Positive Margin Plane Label -->
  <rect x="650" y="115" width="160" height="32" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="730" y="136" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    wᵀx + b = +1
  </text>
  <line x1="650" y1="131" x2="615" y2="131" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Legend / Info Card -->
  <rect x="95" y="465" width="670" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="120" cy="486" r="7" fill="url(#blueBall)"/>
  <text x="135" y="490" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Class +1 (Positive)</text>

  <rect x="270" y="479" width="14" height="14" rx="3" fill="url(#redBall)"/>
  <text x="293" y="490" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Class -1 (Negative)</text>

  <circle cx="430" cy="486" r="10" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="448" y="490" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Support Vectors (Determine Margin)</text>

  <text x="680" y="490" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Optimal Margin = 2/||w||</text>
</svg>
