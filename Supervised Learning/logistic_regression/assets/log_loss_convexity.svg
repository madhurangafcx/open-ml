<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-size="20" font-weight="bold" fill="#f8fafc">Why Log Loss? Convex vs. Non-Convex Loss Landscapes</text>
  <text x="40" y="70" font-size="13" fill="#94a3b8">Squaring the non-linear Sigmoid in MSE creates local minima traps; Log Loss guarantees a single global minimum</text>

  <!-- Panel 1: MSE with Sigmoid (Non-Convex) -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="340" height="300" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <text x="20" y="32" font-size="15" font-weight="bold" fill="#f43f5e">MSE with Sigmoid: Non-Convex ❌</text>
    <text x="20" y="52" font-size="11" fill="#94a3b8">Cost = (1/2m) ∑ (σ(θᵀx) - y)²</text>

    <!-- Axes -->
    <line x1="40" y1="260" x2="40" y2="75" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3)" />
    <line x1="35" y1="250" x2="315" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3)" />
    <text x="35" y="70" font-size="11" fill="#cbd5e1">Cost J(θ)</text>
    <text x="300" y="270" font-size="11" fill="#cbd5e1">Parameter θ</text>

    <!-- Wavy Non-Convex Curve -->
    <path d="M 50 110 C 90 230, 110 240, 140 180 C 170 120, 200 245, 230 245 C 260 245, 280 160, 300 100"
          fill="none" stroke="#f43f5e" stroke-width="3" />

    <!-- Traps (Local Minima) -->
    <circle cx="140" cy="180" r="5" fill="#f43f5e" />
    <text x="110" y="165" font-size="10" font-weight="bold" fill="#f43f5e">Local Trap!</text>

    <!-- Global Minimum -->
    <circle cx="230" cy="245" r="5" fill="#10b981" />
    <text x="210" y="270" font-size="10" font-weight="bold" fill="#10b981">Global Minimum</text>

    <text x="20" y="288" font-size="11" fill="#fca5a5">Gradient descent gets stuck in local traps!</text>
  </g>

  <!-- Panel 2: Binary Cross-Entropy / Log Loss (Convex) -->
  <g transform="translate(420, 95)">
    <rect x="0" y="0" width="340" height="300" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="20" y="32" font-size="15" font-weight="bold" fill="#34d399">Log Loss (Cross-Entropy): Convex ✔</text>
    <text x="20" y="52" font-size="11" fill="#94a3b8">Cost = -(1/m) ∑ [y ln(h) + (1-y) ln(1-h)]</text>

    <!-- Axes -->
    <line x1="40" y1="260" x2="40" y2="75" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3)" />
    <line x1="35" y1="250" x2="315" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3)" />
    <text x="35" y="70" font-size="11" fill="#cbd5e1">Cost J(θ)</text>
    <text x="300" y="270" font-size="11" fill="#cbd5e1">Parameter θ</text>

    <!-- Smooth Convex Bowl -->
    <path d="M 55 100 C 100 245, 130 245, 175 245 C 220 245, 250 245, 295 100"
          fill="none" stroke="#10b981" stroke-width="3" />

    <!-- Single Global Minimum -->
    <circle cx="175" cy="245" r="6" fill="#10b981" stroke="#f8fafc" stroke-width="2" />
    <text x="125" y="270" font-size="11" font-weight="bold" fill="#34d399">Unique Global Minimum</text>

    <!-- Downward Arrows showing Gradient Descent -->
    <path d="M 80 140 L 120 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow3)" />
    <path d="M 270 140 L 230 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow3)" />

    <text x="20" y="288" font-size="11" fill="#6ee7b7">Guaranteed convergence to the best solution!</text>
  </g>

  <!-- Summary Note at Bottom -->
  <text x="400" y="420" font-size="12" fill="#94a3b8" text-anchor="middle">Log Loss penalizes high-confidence wrong predictions with infinite cost: Cost → ∞ as h(x) → 0 when y = 1</text>
</svg>
