<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrowFail" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <linearGradient id="failRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="failRedGradBottom" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-size="20" font-weight="bold" fill="#f8fafc">Why Linear Regression Fails on Classification Tasks</text>
  <text x="40" y="70" font-size="13" fill="#94a3b8">A straight line produces impossible probabilities (&lt; 0 and &gt; 1) and shifts wildly with outliers</text>

  <!-- Invalid Upper Zone (y > 1.0) -->
  <rect x="90" y="90" width="650" height="60" fill="url(#failRedGrad)" />
  <line x1="90" y1="150" x2="740" y2="150" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="745" y="155" font-size="12" font-weight="bold" fill="#f43f5e">y = 1.0 Bound</text>
  <text x="600" y="125" font-size="12" font-weight="bold" fill="#f43f5e">❌ Invalid Probability: P &gt; 1.0</text>

  <!-- Invalid Lower Zone (y < 0.0) -->
  <rect x="90" y="330" width="650" height="60" fill="url(#failRedGradBottom)" />
  <line x1="90" y1="330" x2="740" y2="330" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="745" y="335" font-size="12" font-weight="bold" fill="#f43f5e">y = 0.0 Bound</text>
  <text x="180" y="365" font-size="12" font-weight="bold" fill="#f43f5e">❌ Invalid Probability: P &lt; 0.0</text>

  <!-- Grid Line at Threshold y = 0.5 -->
  <line x1="90" y1="240" x2="740" y2="240" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
  <text x="50" y="245" font-size="12" fill="#94a3b8">0.5</text>

  <!-- Axes -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="90" y1="390" x2="90" y2="85" marker-end="url(#arrowFail)" />
    <line x1="85" y1="330" x2="750" y2="330" marker-end="url(#arrowFail)" />
  </g>
  <text x="80" y="80" font-size="13" font-weight="bold" fill="#e2e8f0" text-anchor="end">Target y (Class Label)</text>
  <text x="740" y="355" font-size="13" font-weight="bold" fill="#e2e8f0" text-anchor="end">Feature x (e.g., Tumor Size)</text>

  <text x="50" y="155" font-size="12" fill="#cbd5e1">1.0</text>
  <text x="50" y="335" font-size="12" fill="#cbd5e1">0.0</text>

  <!-- Data Points: Class 0 (at y = 0, y-coord 330) -->
  <g fill="#06b6d4" stroke="#0f172a" stroke-width="1.5">
    <circle cx="140" cy="330" r="7" />
    <circle cx="180" cy="330" r="7" />
    <circle cx="210" cy="330" r="7" />
    <circle cx="250" cy="330" r="7" />
    <circle cx="280" cy="330" r="7" />
    <circle cx="320" cy="330" r="7" />
  </g>
  <text x="210" y="315" font-size="12" font-weight="bold" fill="#22d3ee">Class 0 (Benign, y = 0)</text>

  <!-- Data Points: Class 1 (at y = 1, y-coord 150) -->
  <g fill="#f43f5e" stroke="#0f172a" stroke-width="1.5">
    <circle cx="460" cy="150" r="7" />
    <circle cx="500" cy="150" r="7" />
    <circle cx="530" cy="150" r="7" />
    <circle cx="580" cy="150" r="7" />
    <circle cx="620" cy="150" r="7" />
    <circle cx="660" cy="150" r="7" />
  </g>
  <text x="520" y="135" font-size="12" font-weight="bold" fill="#f43f5e">Class 1 (Malignant, y = 1)</text>

  <!-- Linear Regression Line (Blue) -->
  <!-- Passes through (120, 375) and (680, 105) -->
  <line x1="100" y1="380" x2="710" y2="95" stroke="#38bdf8" stroke-width="3.5" />

  <!-- Linear Regression Callout Box -->
  <g transform="translate(340, 200)">
    <rect x="0" y="0" width="220" height="48" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="12" y="20" font-size="12" font-weight="bold" fill="#38bdf8">Fitted Line: ŷ = θ₀ + θ₁x</text>
    <text x="12" y="36" font-size="11" fill="#cbd5e1">Straight line cannot curve!</text>
  </g>

  <!-- Sigmoid Comparison Curve (Translucent Green) -->
  <path d="M 100 328 C 250 328, 340 310, 390 240 C 440 170, 520 152, 710 152" 
        fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="5,4" opacity="0.85" />
  <text x="390" y="275" font-size="12" font-weight="bold" fill="#34d399">Sigmoid Curve (Correct!)</text>

  <!-- Bottom Comparison Legend -->
  <g transform="translate(100, 430)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#38bdf8" stroke-width="3" />
    <text x="40" y="4" font-size="12" fill="#cbd5e1">Linear Regression Line (Over/Undershoots Bounds)</text>

    <line x1="420" y1="0" x2="450" y2="0" stroke="#10b981" stroke-width="3" stroke-dasharray="4,3" />
    <text x="460" y="4" font-size="12" fill="#34d399">Logistic Sigmoid Curve (Properly Bounded [0, 1])</text>
  </g>
</svg>
