<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-size="20" font-weight="bold" fill="#f8fafc">Linear Regression: Best-Fit Line &amp; Residuals</text>
  <text x="40" y="70" font-size="13" fill="#94a3b8">Minimizing the vertical distance (residual e = y - ŷ) between observed data and the fitted line</text>

  <!-- Grid Lines -->
  <g stroke="#334155" stroke-dasharray="3,3" stroke-width="1" opacity="0.6">
    <line x1="100" y1="120" x2="740" y2="120" />
    <line x1="100" y1="180" x2="740" y2="180" />
    <line x1="100" y1="240" x2="740" y2="240" />
    <line x1="100" y1="300" x2="740" y2="300" />
    <line x1="100" y1="360" x2="740" y2="360" />
    <line x1="220" y1="90" x2="220" y2="380" />
    <line x1="350" y1="90" x2="350" y2="380" />
    <line x1="480" y1="90" x2="480" y2="380" />
    <line x1="610" y1="90" x2="610" y2="380" />
  </g>

  <!-- Axes -->
  <g stroke="#94a3b8" stroke-width="2">
    <!-- Y-axis -->
    <line x1="100" y1="390" x2="100" y2="85" marker-end="url(#arrow)" />
    <!-- X-axis -->
    <line x1="90" y1="380" x2="750" y2="380" marker-end="url(#arrow)" />
  </g>
  <text x="75" y="80" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">y (Target: Price)</text>
  <text x="720" y="415" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="end">x (Feature: Square Footage)</text>

  <!-- Best-Fit Line (ŷ = θ0 + θ1*x) -->
  <!-- Starts around (100, 320) goes to (720, 110) -->
  <line x1="90" y1="323" x2="730" y2="106" stroke="url(#lineGrad)" stroke-width="3.5" filter="url(#glow)" />

  <!-- Residual Drop Lines (Dashed Red) -->
  <g stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4">
    <!-- Point 1 -->
    <line x1="180" y1="320" x2="180" y2="292" />
    <!-- Point 2 -->
    <line x1="260" y1="215" x2="260" y2="265" />
    <!-- Point 3 -->
    <line x1="360" y1="290" x2="360" y2="231" />
    <!-- Point 4 (Highlighted) -->
    <line x1="470" y1="130" x2="470" y2="194" stroke-width="2.5" />
    <!-- Point 5 -->
    <line x1="560" y1="205" x2="560" y2="163" />
    <!-- Point 6 -->
    <line x1="650" y1="105" x2="650" y2="133" />
  </g>

  <!-- Prediction Points on Line (Cyan dots) -->
  <g fill="#38bdf8">
    <circle cx="180" cy="292" r="4" />
    <circle cx="260" cy="265" r="4" />
    <circle cx="360" cy="231" r="4" />
    <circle cx="470" cy="194" r="5" stroke="#f8fafc" stroke-width="1.5" />
    <circle cx="560" cy="163" r="4" />
    <circle cx="650" cy="133" r="4" />
  </g>

  <!-- Actual Data Points (Amber Glowing dots) -->
  <g fill="#fbbf24" stroke="#0f172a" stroke-width="1.5">
    <circle cx="180" cy="320" r="6" />
    <circle cx="260" cy="215" r="6" />
    <circle cx="360" cy="290" r="6" />
    <circle cx="470" cy="130" r="7" stroke="#f8fafc" stroke-width="2" />
    <circle cx="560" cy="205" r="6" />
    <circle cx="650" cy="105" r="6" />
  </g>

  <!-- Residual Annotation Callout for Point 4 -->
  <g>
    <!-- Bracket / indicator -->
    <rect x="485" y="145" width="220" height="60" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <text x="495" y="168" font-size="12" font-weight="bold" fill="#f43f5e">Residual (Error): e = y - ŷ</text>
    <text x="495" y="185" font-size="11" fill="#cbd5e1">Observed y = $380k</text>
    <text x="495" y="198" font-size="11" fill="#38bdf8">Predicted ŷ = $320k (e = +$60k)</text>
    <line x1="472" y1="162" x2="485" y2="162" stroke="#f43f5e" stroke-width="1.5" />
  </g>

  <!-- Intercept label θ0 -->
  <g>
    <circle cx="100" cy="320" r="5" fill="#a855f7" stroke="#f8fafc" stroke-width="1.5" />
    <text x="40" y="325" font-size="13" font-weight="bold" fill="#c084fc">θ₀ (Intercept)</text>
  </g>

  <!-- Line Formula Callout -->
  <g>
    <rect x="230" y="90" width="190" height="34" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="240" y="112" font-size="13" font-weight="bold" fill="#a5b4fc">Fitted Line: ŷ = θ₀ + θ₁x</text>
  </g>

  <!-- Legend at Bottom -->
  <g transform="translate(130, 430)">
    <circle cx="0" cy="0" r="5" fill="#fbbf24" />
    <text x="12" y="4" font-size="12" fill="#cbd5e1">Actual Observed Data Point (y)</text>

    <line x1="220" y1="0" x2="245" y2="0" stroke="#38bdf8" stroke-width="3" />
    <text x="255" y="4" font-size="12" fill="#cbd5e1">Best-Fit Model (ŷ = θᵀx)</text>

    <line x1="430" y1="0" x2="455" y2="0" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3,3" />
    <text x="465" y="4" font-size="12" fill="#cbd5e1">Vertical Residual / Error (e = y - ŷ)</text>
  </g>
</svg>
